[project]
name = "weather-api"
version = "0.1.0"
description = "地域別のサンプル天気予報API"
authors = [
    { name = "copilot-swe-agent[bot]", email = "198982749+Copilot@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]

[project.scripts]
weather-api = "weather_api:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
